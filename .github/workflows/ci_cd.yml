name: MVN CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  frontend-ci:
    name: Frontend CI (Flutter Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependências do Frontend
        working-directory: ./frontend
        run: flutter pub get

      - name: Executar Análise Estática
        working-directory: ./frontend
        run: flutter analyze

      - name: Executar Testes Automatizados
        working-directory: ./frontend
        run: flutter test --coverage

  backend-ci:
    name: Backend CI (Node.js Smoke & API Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar Dependências do Backend
        working-directory: ./backend
        run: npm ci

      - name: Executar Smoke Tests e Validação de Rotas
        working-directory: ./backend
        run: npm test

  cd-build:
    name: CD (Build e Publicação de Artefatos)
    needs: [frontend-ci, backend-ci]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependências do Frontend
        working-directory: ./frontend
        run: flutter pub get

      # -------------------------------------------------------------
      # 1. Compilação da Aplicação Web e geração do arquivo ZIP
      # -------------------------------------------------------------
      - name: Compilar Aplicação Web
        working-directory: ./frontend
        env:
          API_URL: ${{ secrets.API_URL || vars.API_URL }}
        run: |
          BUILD_ARGS=""
          if [ -n "$API_URL" ]; then
            BUILD_ARGS="$BUILD_ARGS --dart-define=API_URL=$API_URL"
          fi
          flutter build web --release $BUILD_ARGS

      - name: Gerar Arquivo ZIP da Aplicação Web
        run: |
          cd frontend/build/web
          zip -r ../../../mvn-aplicacao.zip . || python3 -m zipfile -c ../../../mvn-aplicacao.zip .

      - name: Publicar Artefato - ZIP da Aplicação
        uses: actions/upload-artifact@v4
        with:
          name: mvn-aplicacao-zip
          path: mvn-aplicacao.zip
          retention-days: 14

      # -------------------------------------------------------------
      # 2. Compilação do APK Android para instalação no dispositivo
      # -------------------------------------------------------------
      - name: Compilar APK Android
        working-directory: ./frontend
        env:
          API_URL: ${{ secrets.API_URL || vars.API_URL }}
          API_HOST: ${{ secrets.API_HOST || vars.API_HOST }}
        run: |
          BUILD_ARGS=""
          if [ -n "$API_URL" ]; then
            BUILD_ARGS="$BUILD_ARGS --dart-define=API_URL=$API_URL"
          elif [ -n "$API_HOST" ]; then
            BUILD_ARGS="$BUILD_ARGS --dart-define=API_HOST=$API_HOST"
          fi
          flutter build apk --release $BUILD_ARGS

      - name: Preparar APK Android com Nome Amigável
        run: |
          cp frontend/build/app/outputs/flutter-apk/app-release.apk frontend/build/app/outputs/flutter-apk/MeuVirtualNutri.apk

      - name: Publicar Artefato - APK Android
        uses: actions/upload-artifact@v4
        with:
          name: mvn-aplicativo-android-apk
          path: frontend/build/app/outputs/flutter-apk/MeuVirtualNutri.apk
          retention-days: 14

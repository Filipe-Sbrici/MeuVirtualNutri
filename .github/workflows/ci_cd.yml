name: MVN CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  frontend-ci:
    name: Frontend CI (Flutter Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependências do Frontend
        working-directory: ./frontend
        run: flutter pub get

      - name: Executar Análise Estática
        working-directory: ./frontend
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Executar Testes Automatizados
        working-directory: ./frontend
        run: flutter test --coverage

  backend-ci:
    name: Backend CI (Node.js Smoke & API Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar Dependências do Backend
        working-directory: ./backend
        run: npm ci

      - name: Executar Smoke Tests e Validação de Rotas
        working-directory: ./backend
        run: npm test

  cd-build:
    name: CD (Build, Backup da Aplicação e APK Android)
    needs: [frontend-ci, backend-ci]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependências do Frontend
        working-directory: ./frontend
        run: flutter pub get

      # -------------------------------------------------------------
      # 1. Compilação da Aplicação Web
      # -------------------------------------------------------------
      - name: Compilar Aplicação Web
        working-directory: ./frontend
        env:
          API_URL: ${{ secrets.API_URL || vars.API_URL }}
        run: |
          BUILD_ARGS=""
          if [ -n "$API_URL" ]; then
            BUILD_ARGS="$BUILD_ARGS --dart-define=API_URL=$API_URL"
          fi
          flutter build web --release $BUILD_ARGS

      # -------------------------------------------------------------
      # 2. Compilação do APK Android para instalação no celular
      # -------------------------------------------------------------
      - name: Compilar APK Android
        working-directory: ./frontend
        env:
          API_URL: ${{ secrets.API_URL || vars.API_URL }}
          API_HOST: ${{ secrets.API_HOST || vars.API_HOST }}
        run: |
          BUILD_ARGS=""
          if [ -n "$API_URL" ]; then
            BUILD_ARGS="$BUILD_ARGS --dart-define=API_URL=$API_URL"
          elif [ -n "$API_HOST" ]; then
            BUILD_ARGS="$BUILD_ARGS --dart-define=API_HOST=$API_HOST"
          fi
          flutter build apk --release $BUILD_ARGS

      - name: Preparar APK Android com Nome Amigável
        run: |
          cp frontend/build/app/outputs/flutter-apk/app-release.apk MeuVirtualNutri.apk
          cp frontend/build/app/outputs/flutter-apk/app-release.apk frontend/build/app/outputs/flutter-apk/MeuVirtualNutri.apk

      # -------------------------------------------------------------
      # 3. Geração do Backup Completo da Aplicação (Código + Web + APK)
      # -------------------------------------------------------------
      - name: Gerar Backup Completo da Aplicação (ZIP)
        run: |
          zip -r mvn-backup-aplicacao.zip \
            backend \
            frontend/lib \
            frontend/test \
            frontend/android \
            frontend/ios \
            frontend/web \
            frontend/pubspec.yaml \
            frontend/pubspec.lock \
            frontend/analysis_options.yaml \
            frontend/build/web \
            MeuVirtualNutri.apk \
            database \
            firestore.rules \
            firestore.indexes.json \
            firebase.json \
            README.md \
            CONFIGURACAO-FIREBASE.md \
            .github/workflows/ci_cd.yml \
            -x "backend/node_modules/*" \
            -x "frontend/android/.gradle/*" \
            -x "frontend/build/app/*"

      - name: Publicar Artifact - Backup da Aplicação
        uses: actions/upload-artifact@v4
        with:
          name: mvn-backup-aplicacao
          path: mvn-backup-aplicacao.zip
          retention-days: 30

      - name: Publicar Artifact - APK Android (MeuVirtualNutri.apk)
        uses: actions/upload-artifact@v4
        with:
          name: mvn-aplicativo-android-apk
          path: MeuVirtualNutri.apk
          retention-days: 30
